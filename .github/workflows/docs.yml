name: docs

# The documentation site at https://ppy.franknoh.dev/, built with MkDocs and
# published to the gh-pages branch by mike. A push to main deploys `dev`; a
# release tag deploys its major.minor and moves `latest` onto it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
      - name: deploy a release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          series="${version%.*}"
          uv run mike deploy --push --update-aliases "$series" latest
          uv run mike set-default --push latest
      - name: deploy the development tip
        if: github.ref == 'refs/heads/main'
        run: |
          uv run mike deploy --push dev
          if ! git show origin/gh-pages:index.html >/dev/null 2>&1; then
            uv run mike set-default --push dev
          fi
      - name: keep the custom domain on the published branch
        run: |
          git fetch origin gh-pages
          git worktree add ../pages origin/gh-pages
          cd ../pages
          if [ "$(cat CNAME 2>/dev/null)" != "ppy.franknoh.dev" ]; then
            echo ppy.franknoh.dev > CNAME
            git add CNAME
            git commit -m "the site's domain"
            git push origin HEAD:gh-pages
          fi
