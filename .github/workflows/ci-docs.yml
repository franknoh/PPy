name: ci

# The other half of `ci.yml`: a change that touches only prose gets the same
# check names, so the branch protection is satisfied without running the
# test matrix, and one job builds the site strictly and holds the docs'
# code blocks to the formatter -- the checks a prose change can fail.
on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "examples/**/measurements.json"
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"
      - "examples/**/measurements.json"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.python == '3.13'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - if: matrix.python == '3.13'
        run: uv sync
      - if: matrix.python == '3.13'
        run: uv run python scripts/doc_examples.py
      - if: matrix.python == '3.13'
        run: uv run mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
      - if: matrix.python != '3.13'
        run: echo "prose only; the site was built once, under 3.13"

  plugins:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ["torch", "jax", "uvicorn", "scipy", "pandas", "pyarrow"]
    steps:
      - run: echo "prose only; no plugin code changed"

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - run: echo "prose only; no compiler code changed"

  artifact:
    runs-on: ubuntu-latest
    steps:
      - run: echo "prose only; no artifact to build"
