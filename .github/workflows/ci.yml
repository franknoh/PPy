name: ci

# A change that touches only prose -- the docs, a README, the changelog --
# runs none of this; `ci-docs.yml` answers for the same check names then,
# so a docs-only pull request still satisfies the branch protection.
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # What the change touched. A change that touches only prose -- the docs,
  # a README, the changelog, a recorded measurement -- skips the test
  # matrix; a skipped required check satisfies the branch protection, and
  # the strict site build runs in its place. Anything else runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.sort.outputs.code }}
      docs: ${{ steps.sort.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: sort
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          prose='^(docs/|mkdocs\.yml$|.*\.md$|examples/.*/measurements\.json$)'
          if echo "$changed" | grep -Ev "$prose" | grep -q .; then code=true; else code=false; fi
          if echo "$changed" | grep -E "$prose" | grep -q .; then docs=true; else docs=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # A prose-only change still has to build the site strictly and keep the
  # docs' code blocks formatted; a code change does both in `check.sh`.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run python scripts/doc_examples.py
      - run: uv run mkdocs build --strict
        env:
          DISABLE_MKDOCS_2_WARNING: "true"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python }}
      # The dev group carries llvmlite, numpy, pydantic, and the linters;
      # torch/jax stay out of CI (accelerator wheels), and every consumer --
      # the test suite, run_all, verify_conversions -- skips what is missing
      # and says so rather than pretending it ran.
      - run: uv sync
      # One gate, shared with local development: scripts/check.sh is the
      # single source of truth for what "clean" means, so a local pass and a
      # CI pass are the same claim.
      - run: ./scripts/check.sh

  # Every integration the README advertises gets a job that actually runs it.
  # The base gate skips them all -- a skip proves nothing, so `plugin_check.sh`
  # fails when a requested plugin's tests do not run.
  plugins:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ["torch", "jax", "uvicorn", "scipy", "pandas", "pyarrow"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --group ${{ matrix.plugin }}
      - run: ./scripts/plugin_check.sh ${{ matrix.plugin }}

  # A built artifact must run where the compiler is not installed, and the
  # wheel must carry what that takes.
  # The compiler's own thirty thousand lines are the largest real corpus the
  # converter has. Every push migrates them: no crash, no `<unknown>` shown,
  # and no more errors than the recorded ceiling (scripts/dogfood.json).
  dogfood:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run python scripts/dogfood.py

  artifact:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q tests/test_build.py
