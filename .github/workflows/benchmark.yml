name: benchmark

# Performance is a claim this repository makes in prose, so it is measured on
# a schedule rather than per pull request: absolute wall times differ between
# runners, and gating every change on them would report noise as regression.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync
      # Reports what moved by more than the tolerance, and fails rather than
      # record anything when the paths stop agreeing on the answer or when
      # this runner could not build them all. `--record` writes the run's raw
      # numbers before that verdict, so the benchmark runs once rather than
      # once for the comparison and again for the artifact, and a failed run
      # still uploads what it managed to measure.
      - run: uv run python scripts/refresh.py --record benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: benchmark.json
