[project]
name = "ppy"
version = "0.1.0"
description = "Pretty Python: a source-compatible, statically analyzable subset of Python"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "libcst>=1.4",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
llvm = ["llvmlite>=0.44"]
numpy = ["numpy>=1.26"]

[project.scripts]
ppy = "ppy_compiler.driver.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "llvmlite>=0.44",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppy", "src/ppy_compiler"]

[tool.ppy]
python = ">=3.12,<3.15"
strict = true
opt-level = 2
cache-dir = ".ppy-cache"
dynamic-boundaries = "explicit"
build-execution = "deny"

[tool.pytest.ini_options]
testpaths = ["tests"]
