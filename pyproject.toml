[project]
name = "ppy"
version = "0.1.0"
description = "Pretty Python: a source-compatible, statically analyzable subset of Python"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "libcst>=1.4",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
llvm = ["llvmlite>=0.44"]
numpy = ["numpy>=1.26"]
torch = ["torch>=2.4", "ninja>=1.11"]
jax = ["jax>=0.4", "jaxlib>=0.4", "flatbuffers>=24.0"]
uvicorn = ["uvicorn>=0.30"]
pydantic = ["pydantic>=2.0"]

[project.scripts]
ppy = "ppy_compiler.driver.cli:main"

[dependency-groups]
# The base group: everything the compiler core and its test suite need.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.0",
    "pyright>=1.1",
    "ruff>=0.6",
    "llvmlite>=0.44",
    "numpy>=1.26",
    "pydantic>=2.0",
]
# Per-plugin groups, so a contributor installs only the runtimes they test.
# ninja is how torch compiles a generated C++ region (spec 20.3).
torch = ["torch>=2.4", "ninja>=1.11"]
# flatbuffers is what jax.export uses to serialize StableHLO (spec 21.3).
jax = ["jax[cuda12]>=0.4", "flatbuffers>=24.0"]
uvicorn = [
    "uvicorn>=0.30",
    "httpx>=0.27",
    "fastapi>=0.115",
]
plugins = [
    { include-group = "torch" },
    { include-group = "jax" },
    { include-group = "uvicorn" },
]
all = [
    { include-group = "dev" },
    { include-group = "plugins" },
]

[tool.uv]
default-groups = ["dev"]

# A plugin's cache key records the accelerator runtime it was built against, so
# which index torch resolves from is part of the project configuration.
[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppy", "src/ppy_compiler"]

# PEP 561: without this marker a type checker treats the runtime as untyped.
[tool.hatch.build.targets.wheel.force-include]
"src/ppy/py.typed" = "ppy/py.typed"
"src/ppy_compiler/py.typed" = "ppy_compiler/py.typed"

[tool.ppy]
python = ">=3.12,<3.15"
strict = true
opt-level = 2
cache-dir = ".ppy-cache"
dynamic-boundaries = "explicit"
build-execution = "deny"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The lint policy is written down so `ruff check` answers the same everywhere.
# Example subdirectories hold converter inputs (deliberately plain Python) and
# byte-exact converter output, both verified by examples/verify_conversions.py;
# linting them is the converter's job, not this file's.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/*/"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RET", "RUF",
    "PERF", "PYI", "ISC", "PIE", "FURB", "BLE", "PL",
]
ignore = [
    # Design metrics: a type checker's dispatch really does have that many
    # branches, and splitting it to please a counter hides the shape.
    "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0916", "PLR1702",
    # Bit widths, argument counts and opt levels are named by their number.
    "PLR2004",
    # `subprocess` here always runs a tool the user installed, by explicit path.
    "S603",
    # Lazy imports are the design: importing torch/jax/llvmlite eagerly costs
    # seconds per invocation, and was measured to (22.4s -> 1.2s).
    "PLC0415",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# Tests state their expectations inline; a magic number is the expectation.
"tests/*" = ["PLR2004", "E501"]

[tool.pylint.main]
ignore-paths = ["examples/.*/.*"]

[tool.pylint."messages control"]
# The same policy as ruff's, for the checks the two tools share; the design
# counters are judgment calls this project makes per function, not globally.
disable = [
    "too-many-branches", "too-many-statements", "too-many-return-statements",
    "too-many-locals", "too-many-arguments", "too-many-instance-attributes",
    "too-many-public-methods", "too-many-lines", "too-few-public-methods",
    "too-many-positional-arguments", "too-many-nested-blocks", "too-many-boolean-expressions",
    "line-too-long", "invalid-name", "duplicate-code",
    "missing-module-docstring", "missing-class-docstring", "missing-function-docstring",
    "fixme", "import-outside-toplevel", "cyclic-import",
    # Plugin and visitor methods implement an interface; an argument one
    # implementation ignores is still part of the signature.
    "unused-argument", "arguments-renamed",
    # Availability probes: `import torch` failing for any reason means the
    # plugin is off, whatever the reason was.
    "broad-exception-caught",
    # A compiler dispatches on exact node classes; `type(x) is Y` is the test
    # it means, and `isinstance` would accept subclasses it must not.
    "unidiomatic-typecheck",
    # pylint's inference cannot follow the plugin registry or llvmlite's
    # dynamic surface; pyright strict is the type checker of record here.
    "no-member", "not-callable", "unsubscriptable-object",
    # Internal API crossing module boundaries inside the same package.
    "protected-access",
    # Two process-wide singletons (LLVM init, the worker pool), each argued
    # at the use site.
    "global-statement",
    # Build-time execution (spec 31) is the feature, policy-gated at run time.
    "exec-used",
    # A pytest fixture is used by shadowing its name; that is the mechanism.
    "redefined-outer-name",
    # torch/jax/uvicorn are optional runtimes, probed behind try/except and
    # absent by design on machines (and CI) that did not opt in.
    "import-error",
]

[tool.pylint.variables]
# `help=` on a diagnostic is its API, matching the `= help:` line it prints.
allowed-redefined-builtins = ["help"]

[tool.pylint.format]
max-line-length = 100
