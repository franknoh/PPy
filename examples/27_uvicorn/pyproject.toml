[project]
name = "ppy-example-webapp"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ppy]
# FastAPI's surface has no plugin yet; strict mode would want a stub for
# each of its calls (E1306).
strict = false
opt-level = 2
source-roots = ["."]

[tool.ppy.plugins.uvicorn]
enabled = true

[tool.ppy.plugins.pydantic]
enabled = true

[tool.ppy.diagnostics]
optimization-remarks = true
